<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyRun</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  :root {
    --bg: #111317; --panel: #181b21; --panel-2: #1f232b; --line: #2a2f39;
    --text: #e6e8ec; --muted: #8b93a3; --accent: #5aa9ff; --accent-ink: #06121f;
    --ok: #4ccf8a; --err: #ff6b6b; --warn: #f5b84a;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
           background: var(--panel); flex-wrap: wrap; }
  .logo { font-weight: 700; letter-spacing: .3px; font-size: 16px; margin-right: 4px; }
  .logo span { color: var(--accent); }
  select, button, textarea { font: inherit; color: inherit; }
  select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 230px; }
  button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: #3b4250; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.primary:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 10px; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--panel-2); color: var(--text); }
  .chip { font-size: 12px; color: var(--muted); padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .chip.ok { color: var(--ok); border-color: #24563d; }
  .chip.warn { color: var(--warn); border-color: #5c4920; }
  .chip.err { color: var(--err); border-color: #5c2a2a; }
  .spacer { flex: 1; }
  .kbd { font-size: 12px; color: var(--muted); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .col + .col { border-left: 1px solid var(--line); }
  .tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 36px; align-items: flex-end; }
  .tab { padding: 6px 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; color: var(--muted); cursor: pointer; background: none; font-size: 13px; }
  .tab.on { background: #212121; color: var(--text); border-color: var(--line); }
  .tab .fname { font-family: var(--mono); font-size: 12px; }
  .editor-wrap { flex: 1; min-height: 0; position: relative; }
  .CodeMirror { height: 100%; font-family: var(--mono); font-size: 14px; }
  .notice { margin: 10px; padding: 10px 12px; border: 1px solid #5c4920; background: #241e12; color: #f1d9a6; border-radius: 6px; font-size: 13px; }
  .notice code { font-family: var(--mono); background: #00000040; padding: 1px 5px; border-radius: 4px; user-select: all; }
  .section-h { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px; font-size: 12px; text-transform: uppercase;
               letter-spacing: .6px; color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--line); }
  .section-h button { padding: 2px 8px; font-size: 12px; text-transform: none; letter-spacing: 0; }
  #stdin { height: 90px; resize: vertical; background: var(--bg); border: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; font-family: var(--mono); font-size: 13px; outline: none; }
  #output { flex: 1; margin: 0; padding: 10px 12px; overflow: auto; font-family: var(--mono); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  #output .stderr { color: var(--err); }
  #output .info { color: var(--muted); }
  #output .okline { color: var(--ok); }
  #preview { flex: 1.4; border: 0; background: #fff; width: 100%; min-height: 0; border-bottom: 1px solid var(--line); }
  .hidden { display: none !important; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 1fr) minmax(320px, 1fr); }
    .col + .col { border-left: 0; border-top: 1px solid var(--line); }
    select { min-width: 0; flex: 1; }
  }
</style>

<body>
<header>
  <div class="logo">Poly<span>Run</span></div>

    <div class="editor-wrap"><textarea id="code"></textarea></div>

    <div class="section-h" id="stdinHead"><span>Input (stdin)</span></div>

    <div class="section-h"><span id="outTitle">Output</span><button id="clearBtn">Clear</button></div>
    <pre id="output"></pre>
  </section>
</main>

  console.log("clicked", clicks);

`,
};
const WEB_TABS = [
  { key: "html", label: "index.html", mode: "htmlmixed" },
  { key: "css", label: "style.css", mode: "css" },
  { key: "js", label: "script.js", mode: "text/javascript" },
];

const URLS = {
  ts: "https://cdnjs.cloudflare.com/ajax/libs/typescript/5.4.5/typescript.min.js",
  pyodide: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/",
  fengari: "https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js",
};
const BROWSER_TIMEOUT_MS = 10000;

// ---------------------------------------------------------------- state
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem("polyrun:" + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("polyrun:" + k, v); } catch {} },
};
let server = null;            // { id: {available, via, hint} } or null when no local server
let current = null;           // current language object
let webTab = "html";
let engineChoice = {};        // lang id -> "local" | "browser"
const docs = {};              // key -> CodeMirror.Doc
const workers = {};           // browser runtime workers by kind
let running = false;

const cm = CodeMirror.fromTextArea($("code"), {
  theme: "material-darker", lineNumbers: true, indentUnit: 4, tabSize: 4,
  matchBrackets: true, autoCloseBrackets: true,
  // Typing <html> inserts </html>; typing </ completes the open tag's name.
  // Block tags (html, body, div, ul…) put the cursor on an indented line between them.
  autoCloseTags: { whenOpening: true, whenClosing: true,
    indentTags: ["html", "head", "body", "div", "section", "article", "aside", "nav", "header", "footer", "main",
                 "ul", "ol", "dl", "table", "thead", "tbody", "tfoot", "tr", "form", "fieldset", "select",
                 "blockquote", "figure", "details", "svg"] },
  matchTags: { bothTags: true },
  extraKeys: {
    "Ctrl-Enter": () => run(), "Cmd-Enter": () => run(),
    "Ctrl-/": "toggleComment", "Cmd-/": "toggleComment",
    Tab: (c) => c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection(" ".repeat(c.getOption("indentUnit"))),
  },
});

function docFor(key, mode, sample) {
  if (!docs[key]) {
    const saved = store.get("code:" + key);
    docs[key] = CodeMirror.Doc(saved != null ? saved : sample, mode);
    let t;
    docs[key].on("change", () => {
      clearTimeout(t);
      t = setTimeout(() => store.set("code:" + key, docs[key].getValue()), 300);
      if (current && current.id === "web") schedulePreview();
    });
  }
  return docs[key];
}

// ---------------------------------------------------------------- engine choice
function engineFor(lang) {
  if (lang.id === "web") return "web";
  if (lang.id === "xpp") return "none";
  const local = server && server[lang.id] && server[lang.id].available;
  const browser = !!lang.browser;
  const pick = engineChoice[lang.id];
  if (pick === "local" && local) return "local";
  if (pick === "browser" && browser) return "browser";
  if (local) return "local";
  if (browser) return "browser";
  return "none";
}

function updateStatus() {
  const lang = current, eng = engineFor(lang), st = $("status");
  const local = server && server[lang.id] && server[lang.id].available;
  $("engineSeg").classList.toggle("hidden", !(local && lang.browser));
  document.querySelectorAll("#engineSeg button").forEach(b => b.classList.toggle("on", b.dataset.engine === eng));
  const notice = $("notice");
  notice.classList.add("hidden");
  $("runBtn").disabled = false;
  if (eng === "web") { st.className = "chip ok"; st.textContent = "Live preview in browser"; }
  else if (eng === "local") { st.className = "chip ok"; st.textContent = "Runs on this computer · " + server[lang.id].via; }
  else if (eng === "browser") {
    st.className = "chip ok";
    st.textContent = { js: "Runs in browser", ts: "Runs in browser · TypeScript compiler",
                       python: "Runs in browser · Pyodide", lua: "Runs in browser · Fengari (Lua 5.3)" }[lang.browser];
  } else if (lang.id === "xpp") {
    st.className = "chip warn"; st.textContent = "Edit only";
    notice.innerHTML = "<b>X++ can't be compiled outside Microsoft Dynamics 365.</b> It has no standalone compiler — X++ is compiled by the " +
      "Dynamics 365 Finance &amp; Operations tooling in Visual Studio against the application's metadata (AOT). " +
      "You can write and highlight it here, then paste it into your D365 development environment to build and run.";
    notice.classList.remove("hidden");
    $("runBtn").disabled = true;
  } else {
    st.className = "chip err"; st.textContent = server ? "Not installed" : "Needs server.py";
    const hint = server && server[lang.id] ? server[lang.id].hint : "";
    notice.innerHTML = !server
      ? "The local runner isn't connected, so only browser languages can run. Start it with <code>python server.py</code> and open <code>http://127.0.0.1:8765</code>."
      : "No " + escapeHtml(lang.name) + " compiler or interpreter was found on this computer." +
        (hint ? " Install one, then click <b>Re-scan</b>:<br><code>" + escapeHtml(hint) + "</code> " : " ") +
        '<button id="rescanBtn" style="margin-left:6px">Re-scan</button>';
    notice.classList.remove("hidden");
    const rb = $("rescanBtn"); if (rb) rb.onclick = rescan;
  }
}

// ---------------------------------------------------------------- switching
function renderTabs() {
  const tabs = $("tabs");
  tabs.innerHTML = "";
  if (current.id === "web") {
    WEB_TABS.forEach(t => {
      const b = document.createElement("button");
      b.className = "tab" + (t.key === webTab ? " on" : "");
      b.innerHTML = '<span class="fname">' + t.label + "</span>";
      b.onclick = () => { webTab = t.key; store.set("webTab", webTab); renderTabs(); showDoc(); };
      tabs.appendChild(b);
    });
  } else {
    const b = document.createElement("button");
    b.className = "tab on";
    b.innerHTML = '<span class="fname">' + current.file + "</span>";
    tabs.appendChild(b);
  }
}

function showDoc() {
  if (current.id === "web") {
    const t = WEB_TABS.find(x => x.key === webTab);
    cm.swapDoc(docFor("web-" + t.key, t.mode, WEB_SAMPLE[t.key]));
    cm.setOption("indentUnit", 2);
  } else {
    cm.swapDoc(docFor(current.id, current.mode, current.sample));
    cm.setOption("indentUnit", ["go"].includes(current.id) ? 8 : 4);
    cm.setOption("indentWithTabs", current.id === "go");
  }
  cm.focus();
}

function selectLang(id) {
  current = LANGS.find(l => l.id === id) || LANGS.find(l => l.id === "python");
  store.set("lang", current.id);
  $("lang").value = current.id;
  const isWeb = current.id === "web";
  $("preview").classList.toggle("hidden", !isWeb);
  $("stdin").classList.toggle("hidden", isWeb);
  $("stdinHead").classList.toggle("hidden", isWeb);
  $("outTitle").textContent = isWeb ? "Console" : "Output";
  $("resetBtn").disabled = current.id === "web" ? false : false;
  const savedIn = store.get("stdin:" + current.id);
  $("stdin").value = savedIn != null ? savedIn : (current.stdin || "");
  renderTabs();
  showDoc();
  updateStatus();
  clearOutput();
  if (isWeb) refreshPreview();
}

function buildSelect() {
  const sel = $("lang");
  sel.innerHTML = "";
  const groups = {};
  LANGS.forEach(l => (groups[l.group] = groups[l.group] || []).push(l));
  Object.entries(groups).forEach(([g, list]) => {
    const og = document.createElement("optgroup");
    og.label = g;
    list.forEach(l => {
      const o = document.createElement("option");
      o.value = l.id;
      const eng = engineFor(l);
      o.textContent = l.name + (eng === "none"
        ? (l.id === "xpp" ? "  — edit only" : server ? "  — not installed" : "  — needs server.py")
        : "");
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  if (current) sel.value = current.id;
}

// ---------------------------------------------------------------- output
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function clearOutput() { $("output").innerHTML = ""; }
function write(text, cls) {
  if (!text) return;
  const out = $("output");
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text;
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}
function finishLine(ok, seconds, extra) {
  const msg = (ok ? "✓ Finished" : "✗ Exited with an error") + (seconds != null ? " in " + seconds + "s" : "") + (extra || "");
  const out = $("output");
  if (out.lastChild && !/\n$/.test(out.lastChild.textContent)) write("\n");
  write("\n" + msg + "\n", ok ? "okline" : "stderr");
}

// ---------------------------------------------------------------- run
async function run() {
  if (running || !current) return;
  if (current.id === "web") { clearOutput(); refreshPreview(); return; }
  const eng = engineFor(current);
  if (eng === "none") return;
  const code = cm.getValue();
  const stdin = $("stdin").value;
  store.set("stdin:" + current.id, stdin);
  clearOutput();
  setRunning(true);
  try {
    if (eng === "local") await runLocal(code, stdin);
    else await runBrowser(current.browser, code, stdin);
  } finally { setRunning(false); }
}

function setRunning(on) {
  running = on;
  const b = $("runBtn");
  b.textContent = on ? "■ Stop" : "▶ Run";
  b.classList.toggle("primary", true);
  b.onclick = on ? stop : run;
}
function stop() {
  Object.keys(workers).forEach(k => { workers[k].w.terminate(); workers[k].reject && workers[k].reject("stopped"); delete workers[k]; });
}

async function runLocal(code, stdin) {
  write("Running with " + server[current.id].via + "…\n", "info");
  let res;
  try {
    const r = await fetch("/api/run", {
      method: "POST", headers: { "Content-Type": "application/json", "X-PolyRun": "1" },
      body: JSON.stringify({ lang: current.id, code, stdin }),
    });
    res = await r.json();
  } catch (e) {
    write("Lost connection to the local runner. Is server.py still running?\n", "stderr");
    return;
  }
  clearOutput();
  if (res.error) { write(res.error + "\n" + (res.hint ? "Install: " + res.hint + "\n" : ""), "stderr"); return; }
  if (res.compile) {
    const c = res.compile;
    if (c.timeout) { write("Compile timed out.\n", "stderr"); }
    if (c.code !== 0 || c.timeout) {
      write(c.stdout, "stderr"); write(c.stderr, "stderr");
      finishLine(false, c.time, " (compile failed)");
      return;
    }
    if ((c.stdout + c.stderr).trim()) write(c.stdout + c.stderr + "\n", "info");
  }
  const r = res.run;
  write(r.stdout); write(r.stderr, "stderr");
  if (r.timeout) finishLine(false, null, " — stopped after the time limit");
  else finishLine(r.code === 0, r.time, r.code !== 0 ? " (exit code " + r.code + ")" : "");
}

// ---------------------------------------------------------------- browser runtimes
const WORKER_SRC = `
const URLS = ${JSON.stringify(URLS)};
let lines = [], li = 0;
self.__polyrun_readline = () => (li < lines.length ? lines[li++] : undefined);
const out = (text, stream) => postMessage({ type: "out", text, stream });
const fmt = (args) => args.map(x => {
  if (typeof x === "string") return x;
  if (x instanceof Error) return x.stack || String(x);
  try { const s = JSON.stringify(x); return s === undefined ? String(x) : s; } catch (e) { return String(x); }
}).join(" ");
console.log = console.info = console.debug = (...a) => out(fmt(a) + "\\n", "stdout");
console.warn = console.error = (...a) => out(fmt(a) + "\\n", "stderr");
self.readline = self.prompt = () => { const l = self.__polyrun_readline(); return l === undefined ? null : l; };
let pyodide = null, tsLoaded = false, luaLoaded = false;
const AsyncFunction = (async () => {}).constructor;

onmessage = async (e) => {
  const { kind, code, stdin } = e.data;
  lines = stdin.length ? stdin.replace(/\\r/g, "").split("\\n") : [];
  if (lines.length && lines[lines.length - 1] === "") lines.pop();
  li = 0;
  try {
    if (kind === "js" || kind === "ts") {
      let js = code;
      if (kind === "ts") {
        if (!tsLoaded) { postMessage({ type: "loading", text: "Loading TypeScript compiler…" }); importScripts(URLS.ts); tsLoaded = true; }
        js = ts.transpile(code, { target: ts.ScriptTarget.ES2020, module: ts.ModuleKind.None });
      }
      postMessage({ type: "started" });
      await new AsyncFunction(js)();
    } else if (kind === "python") {
      if (!pyodide) {
        postMessage({ type: "loading", text: "Loading Python (Pyodide), first run takes a few seconds…" });
        importScripts(URLS.pyodide + "pyodide.js");
        pyodide = await loadPyodide({ indexURL: URLS.pyodide });
      }
      pyodide.setStdout({ batched: (s) => out(s + "\\n", "stdout") });
      pyodide.setStderr({ batched: (s) => out(s + "\\n", "stderr") });
      pyodide.setStdin({ stdin: () => { const l = self.__polyrun_readline(); return l === undefined ? null : l; } });
      postMessage({ type: "started" });
      const globals = pyodide.toPy({ __name__: "__main__" });
      try { await pyodide.runPythonAsync(code, { globals, filename: "main.py" }); }
      finally { globals.destroy(); }
    } else if (kind === "lua") {
      if (!luaLoaded) {
        postMessage({ type: "loading", text: "Loading Lua (Fengari)…" });
        self.window = self;  // fengari-web expects a window global
        importScripts(URLS.fengari); luaLoaded = true;
        self.__polyrun_write = (s) => out(String(s), "stdout");
        fengari.load('local js = require "js"; local g = js.global; io = io or {}; ' +
          'io.write = function(...) for i = 1, select("#", ...) do g:__polyrun_write(tostring((select(i, ...)))) end; return io end; ' +
          'io.read = function(fmt) local l = g:__polyrun_readline(); if l == nil then return nil end; ' +
          'if fmt == "n" or fmt == "*n" or fmt == "*number" then return tonumber(l) end; return l end; ' +
          'io.lines = function() return function() return io.read() end end')();
      }
      postMessage({ type: "started" });
      fengari.load(code, "=main.lua")();
    }
    postMessage({ type: "done", ok: true });
  } catch (err) {
    const msg = err && (err.message || (err.toString && err.toString())) || String(err);
    out(msg + "\\n", "stderr");
    postMessage({ type: "done", ok: false });
  }
};`;
const workerUrl = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));

function runBrowser(kind, code, stdin) {
  return new Promise((resolve) => {
    let entry = workers[kind];
    if (!entry) { entry = workers[kind] = { w: new Worker(workerUrl) }; }
    const w = entry.w;
    let timer = null, start = 0, loadingShown = false;
    const kill = (reason) => {
      w.terminate(); delete workers[kind]; clearTimeout(timer);
      finishLine(false, null, reason);
      resolve();
    };
    entry.reject = () => kill(" — stopped");
    w.onerror = (ev) => { ev.preventDefault(); write((ev.message || "Worker error") + "\n", "stderr"); kill(""); };
    w.onmessage = (ev) => {
      const m = ev.data;
      if (m.type === "loading") { loadingShown = true; write(m.text + "\n", "info"); }
      else if (m.type === "started") {
        if (loadingShown) clearOutput();
        start = performance.now();
        timer = setTimeout(() => kill(" — stopped after " + BROWSER_TIMEOUT_MS / 1000 + "s (infinite loop?)"), BROWSER_TIMEOUT_MS);
      } else if (m.type === "out") write(m.text, m.stream === "stderr" ? "stderr" : "");
      else if (m.type === "done") {
        clearTimeout(timer); entry.reject = null;
        finishLine(m.ok, ((performance.now() - start) / 1000).toFixed(3));
        resolve();
      }
    };
    w.postMessage({ kind, code, stdin });
  });
}

// ---------------------------------------------------------------- web preview
let previewTimer;
function schedulePreview() { clearTimeout(previewTimer); previewTimer = setTimeout(refreshPreview, 500); }
function refreshPreview() {
  const get = (k) => docFor("web-" + k, null, WEB_SAMPLE[k]).getValue();
  const bridge = `<script>(function(){var send=function(level,args){try{parent.postMessage({polyrun:1,level:level,text:Array.prototype.map.call(args,function(x){if(typeof x==="string")return x;try{return JSON.stringify(x)}catch(e){return String(x)}}).join(" ")},"*")}catch(e){}};
["log","info","warn","error","debug"].forEach(function(l){var o=console[l];console[l]=function(){send(l,arguments);o&&o.apply(console,arguments)}});
window.addEventListener("error",function(e){send("error",[e.message+" (line "+e.lineno+")"])});})();<\/script>`;
  let html = get("html");
  const css = "<style>\n" + get("css") + "\n</style>";
  const js = "<script>\n" + get("js").replace(/<\/script/gi, "<\\/script") + "\n<\/script>";
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (m) => m + bridge + css) : bridge + css + html;
  html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, js + "</body>") : html + js;
  clearOutput();
  $("preview").srcdoc = html;
}
window.addEventListener("message", (e) => {
  if (e.source !== $("preview").contentWindow || !e.data || !e.data.polyrun) return;
  write(e.data.text + "\n", e.data.level === "error" || e.data.level === "warn" ? "stderr" : "");
});

// ---------------------------------------------------------------- server
function applyServer(list) {
  server = {};
  list.forEach(l => (server[l.id] = l));
}
async function rescan() {
  try {
    const r = await fetch("/api/redetect", { method: "POST", headers: { "X-PolyRun": "1" } });
    applyServer((await r.json()).languages);
  } catch {}
  buildSelect(); updateStatus();
}

// ---------------------------------------------------------------- wire up
$("lang").onchange = (e) => selectLang(e.target.value);
$("runBtn").onclick = run;
$("clearBtn").onclick = clearOutput;
$("resetBtn").onclick = () => {
  if (current.id === "web") docFor("web-" + webTab).setValue(WEB_SAMPLE[webTab]);
  else docFor(current.id).setValue(current.sample);
};
$("stdin").addEventListener("input", () => store.set("stdin:" + current.id, $("stdin").value));
$("stdin").addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); } });
document.querySelectorAll("#engineSeg button").forEach(b => b.onclick = () => {
  engineChoice[current.id] = b.dataset.engine; updateStatus();
});

(async function init() {
  webTab = store.get("webTab") || "html";
  if (location.protocol.startsWith("http")) {
    try {
      const r = await fetch("/api/languages");
      if (r.ok) applyServer((await r.json()).languages);
    } catch {}
  }
  buildSelect();
  selectLang(store.get("lang") || "python");
})();
</script>
