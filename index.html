<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyRun</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  :root {
    --bg: #111317; --panel: #181b21; --panel-2: #1f232b; --line: #2a2f39;
    --text: #e6e8ec; --muted: #8b93a3; --accent: #5aa9ff; --accent-ink: #06121f;
    --ok: #4ccf8a; --err: #ff6b6b; --warn: #f5b84a; --typed: #f0c674;
    --mono: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line);
           background: var(--panel); flex-wrap: wrap; }
  .logo { font-weight: 700; letter-spacing: .3px; font-size: 16px; margin-right: 4px; }
  .logo span { color: var(--accent); }
  select, button, input { font: inherit; color: inherit; }
  select { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 230px; }
  button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: #3b4250; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; min-width: 84px; }
  button.primary.stop { background: var(--err); border-color: var(--err); color: #1d0606; }
  button:disabled { opacity: .5; cursor: default; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 10px; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--panel-2); color: var(--text); }
  .chip { font-size: 12px; color: var(--muted); padding: 3px 8px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
  .chip.ok { color: var(--ok); border-color: #24563d; }
  .chip.warn { color: var(--warn); border-color: #5c4920; }
  .chip.err { color: var(--err); border-color: #5c2a2a; }
  .spacer { flex: 1; }
  .kbd { font-size: 12px; color: var(--muted); }
  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); min-height: 0; }
  .col { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .col + .col { border-left: 1px solid var(--line); }
  .tabs { display: flex; gap: 2px; padding: 6px 8px 0; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 36px; align-items: flex-end; }
  .tab { padding: 6px 12px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; color: var(--muted); cursor: pointer; background: none; font-size: 13px; }
  .tab.on { background: #212121; color: var(--text); border-color: var(--line); }
  .tab .fname { font-family: var(--mono); font-size: 12px; }
  .editor-wrap { flex: 1; min-height: 0; position: relative; }
  .CodeMirror { height: 100%; font-family: var(--mono); font-size: 14px; }
  .notice { margin: 10px; padding: 10px 12px; border: 1px solid #5c4920; background: #241e12; color: #f1d9a6; border-radius: 6px; font-size: 13px; }
  .notice code { font-family: var(--mono); background: #00000040; padding: 1px 5px; border-radius: 4px; user-select: all; }
  .section-h { display: flex; align-items: center; gap: 10px; padding: 6px 12px; font-size: 12px; text-transform: uppercase;
               letter-spacing: .6px; color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--line); }
  .section-h .grow { flex: 1; }
  .section-h button { padding: 2px 8px; font-size: 12px; text-transform: none; letter-spacing: 0; }
  #conHint { text-transform: none; letter-spacing: 0; color: var(--muted); }
  #conHint.waiting { color: var(--typed); }
  #output { flex: 1; margin: 0; padding: 10px 12px; overflow: auto; font-family: var(--mono); font-size: 13px;
            white-space: pre-wrap; word-break: break-word; cursor: text; }
  #output .stderr { color: var(--err); }
  #output .info { color: var(--muted); }
  #output .okline { color: var(--ok); }
  #output .typed { color: var(--typed); }
  #conIn { background: transparent; border: 0; outline: none; padding: 0; margin: 0; font: inherit; color: var(--typed);
           caret-color: var(--typed); min-width: 12ch; width: 60%; }
  #conIn.waiting { background: #f0c67414; border-radius: 3px; }
  #preview { flex: 1.4; border: 0; background: #fff; width: 100%; min-height: 0; border-bottom: 1px solid var(--line); }
  .hidden { display: none !important; }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: minmax(320px, 1fr) minmax(320px, 1fr); }
    .col + .col { border-left: 0; border-top: 1px solid var(--line); }
    select { min-width: 0; flex: 1; }
    .kbd { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">Poly<span>Run</span></div>
  <select id="lang" aria-label="Language"></select>
  <div class="seg hidden" id="engineSeg" role="group" aria-label="Where to run">
    <button data-engine="local">This computer</button>
    <button data-engine="browser">Browser</button>
  </div>
  <span class="chip" id="status">Loading…</span>
  <div class="spacer"></div>
  <span class="kbd">Ctrl+Enter to run</span>
  <button id="resetBtn" title="Replace the code with the example">Reset example</button>
  <button class="primary" id="runBtn">▶ Run</button>
</header>

<main>
  <section class="col">
    <div class="tabs" id="tabs"></div>
    <div id="notice" class="notice hidden"></div>
    <div class="editor-wrap"><textarea id="code"></textarea></div>
  </section>
  <section class="col">
    <iframe id="preview" class="hidden" title="Web page preview" sandbox="allow-scripts allow-modals allow-forms"></iframe>
    <div class="section-h">
      <span id="outTitle">Console</span>
      <span id="conHint"></span>
      <span class="grow"></span>
      <button id="clearBtn">Clear</button>
    </div>
    <pre id="output"></pre>
  </section>
</main>

`,
};
const WEB_TABS = [
  { key: "html", label: "index.html", mode: "htmlmixed" },
  { key: "css", label: "style.css", mode: "css" },
  { key: "js", label: "script.js", mode: "text/javascript" },
];

const URLS = {
  ts: "https://cdnjs.cloudflare.com/ajax/libs/typescript/5.4.5/typescript.min.js",
  pyodide: "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/",
  fengari: "https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js",
};
const BROWSER_TIMEOUT_MS = 10000;   // compute time allowed between inputs
// Workers can pause for typed input only when the page is cross-origin isolated
// (server.py sends the headers). Opened as a plain file, input uses a dialog box.
const CAN_BLOCK = window.crossOriginIsolated === true && typeof SharedArrayBuffer === "function";

// ---------------------------------------------------------------- state
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem("polyrun:" + k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem("polyrun:" + k, v); } catch {} },
};
let server = null;            // { id: {available, via, hint} } or null when no local server
let current = null;           // current language object
let webTab = "html";
let engineChoice = {};        // lang id -> "local" | "browser"
const docs = {};              // key -> CodeMirror.Doc
const workers = {};           // browser runtime workers by kind
let active = null;            // the running program: { send(text), eof(), stop() }

const cm = CodeMirror.fromTextArea($("code"), {
  theme: "material-darker", lineNumbers: true, indentUnit: 4, tabSize: 4,
  matchBrackets: true, autoCloseBrackets: true,
  // Typing <html> inserts </html>; typing </ completes the open tag's name.
  autoCloseTags: { whenOpening: true, whenClosing: true,
    indentTags: ["html", "head", "body", "div", "section", "article", "aside", "nav", "header", "footer", "main",
                 "ul", "ol", "dl", "table", "thead", "tbody", "tfoot", "tr", "form", "fieldset", "select",
                 "blockquote", "figure", "details", "svg"] },
  matchTags: { bothTags: true },
  extraKeys: {
    "Ctrl-Enter": () => run(), "Cmd-Enter": () => run(),
    "Ctrl-/": "toggleComment", "Cmd-/": "toggleComment",
    Tab: (c) => c.somethingSelected() ? c.indentSelection("add") : c.replaceSelection(" ".repeat(c.getOption("indentUnit"))),
  },
});

function docFor(key, mode, sample) {
  if (!docs[key]) {
    const saved = store.get("code:" + key);
    docs[key] = CodeMirror.Doc(saved != null ? saved : sample, mode);
    let t;
    docs[key].on("change", () => {
      clearTimeout(t);
      t = setTimeout(() => store.set("code:" + key, docs[key].getValue()), 300);
      if (current && current.id === "web") schedulePreview();
    });
  }
  return docs[key];
}

// ---------------------------------------------------------------- engine choice
function engineFor(lang) {
  if (lang.id === "web") return "web";
  if (lang.id === "xpp") return "none";
  const local = server && server[lang.id] && server[lang.id].available;
  const browser = !!lang.browser;
  const pick = engineChoice[lang.id];
  if (pick === "local" && local) return "local";
  if (pick === "browser" && browser) return "browser";
  if (local) return "local";
  if (browser) return "browser";
  return "none";
}

function updateStatus() {
  const lang = current, eng = engineFor(lang), st = $("status");
  const local = server && server[lang.id] && server[lang.id].available;
  $("engineSeg").classList.toggle("hidden", !(local && lang.browser));
  document.querySelectorAll("#engineSeg button").forEach(b => b.classList.toggle("on", b.dataset.engine === eng));
  const notice = $("notice");
  notice.classList.add("hidden");
  $("runBtn").disabled = false;
  if (eng === "web") { st.className = "chip ok"; st.textContent = "Live preview in browser"; }
  else if (eng === "local") { st.className = "chip ok"; st.textContent = "Runs on this computer · " + server[lang.id].via; }
  else if (eng === "browser") {
    st.className = "chip ok";
    st.textContent = { js: "Runs in browser", ts: "Runs in browser · TypeScript compiler",
                       python: "Runs in browser · Pyodide", lua: "Runs in browser · Fengari (Lua 5.3)" }[lang.browser];
  } else if (lang.id === "xpp") {
    st.className = "chip warn"; st.textContent = "Edit only";
    notice.innerHTML = "<b>X++ can't be compiled outside Microsoft Dynamics 365.</b> It has no standalone compiler — X++ is compiled by the " +
      "Dynamics 365 Finance &amp; Operations tooling in Visual Studio against the application's metadata (AOT). " +
      "You can write and highlight it here, then paste it into your D365 development environment to build and run.";
    notice.classList.remove("hidden");
    $("runBtn").disabled = true;
  } else {
    st.className = "chip err"; st.textContent = server ? "Not installed" : "Needs server.py";
    const hint = server && server[lang.id] ? server[lang.id].hint : "";
    notice.innerHTML = !server
      ? "The local runner isn't connected, so only browser languages can run. Start it with <code>python server.py</code> (or double-click <code>start.bat</code>) and open <code>http://127.0.0.1:8765</code>."
      : "No " + escapeHtml(lang.name) + " compiler or interpreter was found on this computer." +
        (hint ? " Install one, then click <b>Re-scan</b>:<br><code>" + escapeHtml(hint) + "</code> " : " ") +
        '<button id="rescanBtn" style="margin-left:6px">Re-scan</button>';
    notice.classList.remove("hidden");
    const rb = $("rescanBtn"); if (rb) rb.onclick = rescan;
  }
}

// ---------------------------------------------------------------- switching
function renderTabs() {
  const tabs = $("tabs");
  tabs.innerHTML = "";
  if (current.id === "web") {
    WEB_TABS.forEach(t => {
      const b = document.createElement("button");
      b.className = "tab" + (t.key === webTab ? " on" : "");
      b.innerHTML = '<span class="fname">' + t.label + "</span>";
      b.onclick = () => { webTab = t.key; store.set("webTab", webTab); renderTabs(); showDoc(); };
      tabs.appendChild(b);
    });
  } else {
    const b = document.createElement("button");
    b.className = "tab on";
    b.innerHTML = '<span class="fname">' + current.file + "</span>";
    tabs.appendChild(b);
  }
}

function showDoc() {
  if (current.id === "web") {
    const t = WEB_TABS.find(x => x.key === webTab);
    cm.swapDoc(docFor("web-" + t.key, t.mode, WEB_SAMPLE[t.key]));
    cm.setOption("indentUnit", 2);
    cm.setOption("indentWithTabs", false);
  } else {
    cm.swapDoc(docFor(current.id, current.mode, current.sample));
    cm.setOption("indentUnit", current.id === "go" ? 8 : 4);
    cm.setOption("indentWithTabs", current.id === "go");
  }
  cm.focus();
}

function selectLang(id) {
  if (active) stopActive();
  current = LANGS.find(l => l.id === id) || LANGS.find(l => l.id === "python");
  store.set("lang", current.id);
  $("lang").value = current.id;
  const isWeb = current.id === "web";
  $("preview").classList.toggle("hidden", !isWeb);
  renderTabs();
  showDoc();
  updateStatus();
  clearOutput();
  setHint("");
  if (isWeb) refreshPreview();
}

function buildSelect() {
  const sel = $("lang");
  sel.innerHTML = "";
  const groups = {};
  LANGS.forEach(l => (groups[l.group] = groups[l.group] || []).push(l));
  Object.entries(groups).forEach(([g, list]) => {
    const og = document.createElement("optgroup");
    og.label = g;
    list.forEach(l => {
      const o = document.createElement("option");
      o.value = l.id;
      const eng = engineFor(l);
      o.textContent = l.name + (eng === "none"
        ? (l.id === "xpp" ? "  — edit only" : server ? "  — not installed" : "  — needs server.py")
        : "");
      og.appendChild(o);
    });
    sel.appendChild(og);
  });
  if (current) sel.value = current.id;
}

// ---------------------------------------------------------------- console
const out = $("output");
const conIn = document.createElement("input");
conIn.id = "conIn";
conIn.type = "text";
conIn.spellcheck = false;
conIn.autocomplete = "off";
conIn.setAttribute("aria-label", "Program input");

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function clearOutput() {
  out.innerHTML = "";
  if (active && active.interactive) out.appendChild(conIn);
}
function write(text, cls) {
  if (!text) return;
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text;
  if (conIn.parentNode === out) out.insertBefore(span, conIn); else out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}
function outputText() { return Array.from(out.childNodes).filter(n => n !== conIn).map(n => n.textContent).join(""); }
function lastLine() { const t = outputText(); return t.slice(t.lastIndexOf("\n") + 1); }
function finishLine(ok, seconds, extra) {
  if (outputText() && !/\n$/.test(outputText())) write("\n");
  const msg = (ok ? "✓ Finished" : "✗ Exited with an error") + (seconds != null ? " in " + seconds + "s" : "") + (extra || "");
  write("\n" + msg + "\n", ok ? "okline" : "stderr");
}
function setHint(text, waiting) {
  const h = $("conHint");
  h.textContent = text;
  h.classList.toggle("waiting", !!waiting);
}
function setWaiting(on) {
  conIn.classList.toggle("waiting", on);
  setHint(on ? "⌨ waiting for your input — type and press Enter" : (active ? "running… type input and press Enter" : ""), on);
  if (on) conIn.focus({ preventScroll: true });
}

conIn.addEventListener("keydown", (e) => {
  if (!active) return;
  if (e.key === "Enter") {
    e.preventDefault();
    const line = conIn.value;
    conIn.value = "";
    write(line + "\n", "typed");
    active.send(line + "\n");
  } else if ((e.ctrlKey || e.metaKey) && (e.key === "d" || e.key === "z")) {
    e.preventDefault();
    write("^" + e.key.toUpperCase() + " (end of input)\n", "info");
    active.eof();
  } else if ((e.ctrlKey || e.metaKey) && e.key === "c" && conIn.selectionStart === conIn.selectionEnd) {
    e.preventDefault();
    write("^C\n", "info");
    stopActive();
  }
});
out.addEventListener("mouseup", () => {
  const sel = window.getSelection();
  if (conIn.parentNode === out && (!sel || sel.isCollapsed)) conIn.focus({ preventScroll: true });
});

// ---------------------------------------------------------------- run / stop
async function run() {
  if (active || !current) return;
  if (current.id === "web") { clearOutput(); refreshPreview(); return; }
  const eng = engineFor(current);
  if (eng === "none") return;
  const code = cm.getValue();
  clearOutput();
  if (eng === "local") await runLocal(code);
  else if (CAN_BLOCK) await runInWorker(current.browser, code);
  else await runOnPage(current.browser, code);
}

function begin(controller) {
  active = controller;
  const b = $("runBtn");
  b.textContent = "■ Stop";
  b.classList.add("stop");
  b.onclick = stopActive;
  if (controller.interactive) {
    out.appendChild(conIn);
    conIn.value = "";
    setWaiting(false);
    conIn.focus({ preventScroll: true });
  }
}
function end() {
  active = null;
  conIn.remove();
  conIn.classList.remove("waiting");
  setHint("");
  const b = $("runBtn");
  b.textContent = "▶ Run";
  b.classList.remove("stop");
  b.onclick = run;
}
function stopActive() { if (active) active.stop(); }

// ---------------------------------------------------------------- local runner (server.py)
async function api(method, path, body) {
  const headers = { "X-PolyRun": "1" };
  if (body) headers["Content-Type"] = "application/json";
  const r = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  return r.json();
}

async function runLocal(code) {
  let res;
  try { res = await api("POST", "/api/run", { lang: current.id, code }); }
  catch { write("Can't reach the local runner. Is server.py still running?\n", "stderr"); return; }
  if (res.error) { write(res.error + "\n" + (res.hint ? "Install: " + res.hint + "\n" : ""), "stderr"); return; }
  const id = res.id;
  const quiet = () => {};
  begin({
    interactive: true,
    send: (text) => api("POST", "/api/input", { id, text }).catch(quiet),
    eof: () => api("POST", "/api/input", { id, text: "", eof: true }).catch(quiet),
    stop: () => api("POST", "/api/stop", { id }).catch(quiet),
  });
  let since = 0;
  try {
    for (;;) {
      const p = await api("GET", "/api/poll?id=" + id + "&since=" + since);
      if (p.error) { write(p.error + "\n", "stderr"); break; }
      since += p.events.length;
      p.events.forEach(handleServerEvent);
      if (p.done) break;
    }
  } catch {
    write("\nLost connection to the local runner. Is server.py still running?\n", "stderr");
  } finally { end(); }
}

function handleServerEvent(ev) {
  if (ev.t === "info") write(ev.d, "info");
  else if (ev.t === "compile") {
    if (!ev.ok) write(ev.d, "stderr");
    else if (ev.d.trim()) write(ev.d, "info");
  } else if (ev.t === "out") write(ev.d, ev.s === "stderr" ? "stderr" : "");
  else if (ev.t === "exit") {
    if (ev.reason === "compile") finishLine(false, null, " (compile failed)");
    else if (ev.reason === "timeout") finishLine(false, null, " — stopped after 2 minutes without input");
    else if (ev.reason === "stopped") finishLine(false, null, " — stopped");
    else finishLine(ev.code === 0, ev.time, ev.code !== 0 ? " (exit code " + ev.code + ")" : "");
  }
}

// ---------------------------------------------------------------- browser runtimes
// This function runs inside a Web Worker (or on the page as a fallback), so it
// must only use what `env` gives it.
function polyrunRuntime(env) {
  const G = globalThis;
  const out = (text, stream) => { if (text) env.post({ type: "out", text, stream: stream || "stdout" }); };
  const fmt = (args) => args.map((x) => {
    if (typeof x === "string") return x;
    if (x instanceof Error) return x.stack || String(x);
    try { const s = JSON.stringify(x); return s === undefined ? String(x) : s; } catch (e) { return String(x); }
  }).join(" ");
  const readLine = () => env.readLine();          // a line without "\n", or null at end of input
  const input = (msg) => { if (msg !== undefined && msg !== null) out(String(msg)); return readLine(); };
  const AsyncFunction = (async () => {}).constructor;
  const decoders = { stdout: new TextDecoder(), stderr: new TextDecoder() };
  let pyodide = null, tsReady = false, luaReady = false;
  const LUA_PRELUDE =
    'local js = require "js"; local g = js.global; io = io or {}; ' +
    'io.write = function(...) for i = 1, select("#", ...) do g:__polyrun_write(tostring((select(i, ...)))) end; return io end; ' +
    'local function readline() return g:__polyrun_readline() end; ' +
    'io.read = function(fmt, ...) fmt = fmt or "l"; if type(fmt) == "string" then fmt = fmt:gsub("^%*", "") end; ' +
    '  if fmt == "a" then local t = {}; for l in readline do t[#t + 1] = l end; return table.concat(t, "\\n") end; ' +
    '  local l = readline(); if l == nil then return nil end; ' +
    '  if fmt == "n" or fmt == "number" then return tonumber((l:match("^%s*(.-)%s*$"))) end; ' +
    '  if type(fmt) == "number" then return l:sub(1, fmt) end; ' +
    '  if fmt == "L" then return l .. "\\n" end; return l end; ' +
    'io.lines = function() return readline end';

  return async function run(kind, code) {
    const saved = {}, savedPrompt = G.prompt;
    ["log", "info", "debug", "warn", "error"].forEach((k) => { saved[k] = console[k]; });
    console.log = console.info = console.debug = (...a) => out(fmt(a) + "\n");
    console.warn = console.error = (...a) => out(fmt(a) + "\n", "stderr");
    G.input = input;
    G.readline = input;
    G.prompt = input;
    try {
      if (kind === "js" || kind === "ts") {
        let js = code;
        if (kind === "ts") {
          if (!tsReady) { env.post({ type: "loading", text: "Loading TypeScript compiler…" }); await env.load(env.urls.ts); tsReady = true; }
          js = G.ts.transpile(code, { target: G.ts.ScriptTarget.ES2020, module: G.ts.ModuleKind.None });
        }
        env.post({ type: "started" });
        await new AsyncFunction(js)();
      } else if (kind === "python") {
        if (!pyodide) {
          env.post({ type: "loading", text: "Loading Python (Pyodide), the first run takes a few seconds…" });
          await env.load(env.urls.pyodide + "pyodide.js");
          pyodide = await G.loadPyodide({ indexURL: env.urls.pyodide });
          pyodide.setStdout({ write: (b) => { out(decoders.stdout.decode(b, { stream: true })); return b.length; } });
          pyodide.setStderr({ write: (b) => { out(decoders.stderr.decode(b, { stream: true }), "stderr"); return b.length; } });
          // Hand Python one typed line per read, so input() returns as soon as Enter is pressed.
          let pending = new Uint8Array(0);
          const encoder = new TextEncoder();
          pyodide.setStdin({ read: (buf) => {
            if (!pending.length) {
              const l = readLine();
              if (l === null) return 0;
              pending = encoder.encode(l + "\n");
            }
            const n = Math.min(buf.length, pending.length);
            buf.set(pending.subarray(0, n));
            pending = pending.subarray(n);
            return n;
          } });
          pyodide.runPython("import sys; sys.stdout.reconfigure(line_buffering=True); sys.stderr.reconfigure(line_buffering=True)");
        }
        env.post({ type: "started" });
        const globals = pyodide.toPy({ __name__: "__main__" });
        try { await pyodide.runPythonAsync(code, { globals, filename: "main.py" }); }
        catch (err) {
          // Show the traceback without Pyodide's own internal frames.
          const msg = String(err && err.message || err);
          const i = msg.indexOf('File "main.py"');
          out(i >= 0 ? "Traceback (most recent call last):\n  " + msg.slice(i) : msg, "stderr");
          return false;
        } finally {
          pyodide.runPython("import sys; sys.stdout.flush(); sys.stderr.flush()");
          globals.destroy();
        }
      } else if (kind === "lua") {
        if (!luaReady) {
          env.post({ type: "loading", text: "Loading Lua (Fengari)…" });
          if (env.isWorker) G.window = G;          // fengari-web expects a window global
          await env.load(env.urls.fengari);
          G.__polyrun_write = (s) => out(String(s));
          G.__polyrun_readline = () => { const l = readLine(); return l === null ? undefined : l; };
          G.fengari.load(LUA_PRELUDE)();
          luaReady = true;
        }
        env.post({ type: "started" });
        G.fengari.load(code, "=main.lua")();
      }
      return true;
    } catch (err) {
      const msg = err && (err.message || (err.toString && err.toString())) || String(err);
      out(msg + "\n", "stderr");
      return false;
    } finally {
      if (!env.isWorker) { Object.assign(console, saved); G.prompt = savedPrompt; }
    }
  };
}

const WORKER_SRC = `"use strict";
const polyrunRuntime = ${polyrunRuntime.toString()};
let ctrl = null, data = null;
const decoder = new TextDecoder();
const runCode = polyrunRuntime({
  isWorker: true,
  urls: ${JSON.stringify(URLS)},
  post: (m) => postMessage(m),
  load: async (url) => importScripts(url),
  readLine() {
    // Ask the page for a line, then sleep until it writes one into shared memory.
    Atomics.store(ctrl, 0, 0);
    postMessage({ type: "input" });
    Atomics.wait(ctrl, 0, 0);
    const n = Atomics.load(ctrl, 1);
    if (n < 0) return null;
    const copy = new Uint8Array(n);
    copy.set(data.subarray(0, n));
    return decoder.decode(copy);
  },
});
onmessage = async (e) => {
  if (e.data.sab) { ctrl = new Int32Array(e.data.sab, 0, 2); data = new Uint8Array(e.data.sab, 8); return; }
  const ok = await runCode(e.data.kind, e.data.code);
  postMessage({ type: "done", ok });
};`;
const workerUrl = URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }));
const INPUT_BYTES = 1 << 16;

function runInWorker(kind, code) {
  return new Promise((resolve) => {
    let entry = workers[kind];
    if (!entry) {
      const w = new Worker(workerUrl);
      const sab = new SharedArrayBuffer(8 + INPUT_BYTES);
      w.postMessage({ sab });
      entry = workers[kind] = { w, ctrl: new Int32Array(sab, 0, 2), data: new Uint8Array(sab, 8) };
    }
    const w = entry.w;
    let timer = null, start = performance.now(), loading = false, waiting = false, finished = false;
    const queued = [];
    const armTimer = () => {
      clearTimeout(timer);
      timer = setTimeout(() => finish(false, " — stopped after " + BROWSER_TIMEOUT_MS / 1000 + "s of running (infinite loop?)", true), BROWSER_TIMEOUT_MS);
    };
    const finish = (ok, extra, kill) => {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      if (kill) { w.terminate(); delete workers[kind]; }
      finishLine(ok, kill ? null : ((performance.now() - start) / 1000).toFixed(3), extra);
      end();
      resolve();
    };
    const deliver = (line) => {               // line without "\n", or null for end of input
      let n = -1;
      if (line !== null) {
        const bytes = new TextEncoder().encode(line).subarray(0, INPUT_BYTES);
        entry.data.set(bytes);
        n = bytes.length;
      }
      Atomics.store(entry.ctrl, 1, n);
      Atomics.store(entry.ctrl, 0, 1);
      Atomics.notify(entry.ctrl, 0);
      waiting = false;
      setWaiting(false);
      armTimer();
    };
    begin({
      interactive: true,
      send: (text) => text.replace(/\n$/, "").split("\n").forEach((l) => (waiting ? deliver(l) : queued.push(l))),
      eof: () => (waiting ? deliver(null) : queued.push(null)),
      stop: () => finish(false, " — stopped", true),
    });
    w.onerror = (ev) => { ev.preventDefault(); write((ev.message || "Worker error") + "\n", "stderr"); finish(false, "", true); };
    w.onmessage = (ev) => {
      const m = ev.data;
      if (finished) return;
      if (m.type === "loading") { loading = true; write(m.text + "\n", "info"); }
      else if (m.type === "started") { if (loading) clearOutput(); start = performance.now(); armTimer(); }
      else if (m.type === "out") write(m.text, m.stream === "stderr" ? "stderr" : "");
      else if (m.type === "input") {
        if (queued.length) deliver(queued.shift());
        else { waiting = true; clearTimeout(timer); setWaiting(true); }
      } else if (m.type === "done") finish(m.ok, "");
    };
    w.postMessage({ kind, code });
  });
}

// Fallback when the page isn't cross-origin isolated (e.g. opened as a plain file):
// the code runs on the page and input comes from a small dialog box.
let pageRuntime = null, pageSink = null;
let nativePrompt = window.prompt.bind(window);   // the browser's dialog, kept before programs replace prompt()
function loadScript(url) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = url; s.onload = res; s.onerror = () => rej(new Error("Could not load " + url + " (are you online?)"));
    document.head.appendChild(s);
  });
}
async function runOnPage(kind, code) {
  if (!pageRuntime) pageRuntime = polyrunRuntime({
    isWorker: false, urls: URLS, load: loadScript,
    post: (m) => pageSink && pageSink(m),
    readLine: () => {
      const v = nativePrompt(lastLine().trim() || "Input for your program:");
      if (v !== null) write(v + "\n", "typed");
      return v;
    },
  });
  let start = performance.now(), loading = false;
  pageSink = (m) => {
    if (m.type === "loading") { loading = true; write(m.text + "\n", "info"); }
    else if (m.type === "started") { if (loading) clearOutput(); start = performance.now(); }
    else if (m.type === "out") write(m.text, m.stream === "stderr" ? "stderr" : "");
  };
  begin({ interactive: false, stop: () => {} });
  setHint("input opens a dialog box here — run start.bat to type in the console instead");
  await new Promise((r) => setTimeout(r, 30));   // let the page paint before code runs
  try {
    const ok = await pageRuntime(kind, code);
    finishLine(ok, ((performance.now() - start) / 1000).toFixed(3));
  } finally { end(); }
}

// ---------------------------------------------------------------- web preview
let previewTimer;
function schedulePreview() { clearTimeout(previewTimer); previewTimer = setTimeout(refreshPreview, 500); }
function refreshPreview() {
  const get = (k) => docFor("web-" + k, null, WEB_SAMPLE[k]).getValue();
  const bridge = `<script>(function(){var send=function(level,args){try{parent.postMessage({polyrun:1,level:level,text:Array.prototype.map.call(args,function(x){if(typeof x==="string")return x;try{return JSON.stringify(x)}catch(e){return String(x)}}).join(" ")},"*")}catch(e){}};
["log","info","warn","error","debug"].forEach(function(l){var o=console[l];console[l]=function(){send(l,arguments);o&&o.apply(console,arguments)}});
window.addEventListener("error",function(e){send("error",[e.message+" (line "+e.lineno+")"])});})();<\/script>`;
  let html = get("html");
  const css = "<style>\n" + get("css") + "\n</style>";
  const js = "<script>\n" + get("js").replace(/<\/script/gi, "<\\/script") + "\n<\/script>";
  html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, (m) => m + bridge + css) : bridge + css + html;
  html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, js + "</body>") : html + js;
  clearOutput();
  $("preview").srcdoc = html;
}
window.addEventListener("message", (e) => {
  if (e.source !== $("preview").contentWindow || !e.data || !e.data.polyrun) return;
  write(e.data.text + "\n", e.data.level === "error" || e.data.level === "warn" ? "stderr" : "");
});

// ---------------------------------------------------------------- server
function applyServer(list) {
  server = {};
  list.forEach(l => (server[l.id] = l));
}
async function rescan() {
  try { applyServer((await api("POST", "/api/redetect", {})).languages); } catch {}
  buildSelect(); updateStatus();
}

// ---------------------------------------------------------------- wire up
$("lang").onchange = (e) => selectLang(e.target.value);
$("runBtn").onclick = run;
$("clearBtn").onclick = clearOutput;
$("resetBtn").onclick = () => {
  if (current.id === "web") docFor("web-" + webTab).setValue(WEB_SAMPLE[webTab]);
  else docFor(current.id).setValue(current.sample);
};
document.querySelectorAll("#engineSeg button").forEach(b => b.onclick = () => {
  engineChoice[current.id] = b.dataset.engine; updateStatus();
});

(async function init() {
  webTab = store.get("webTab") || "html";
  if (location.protocol.startsWith("http")) {
    try {
      const r = await fetch("/api/languages");
      if (r.ok) applyServer((await r.json()).languages);
    } catch {}
  }
  buildSelect();
  selectLang(store.get("lang") || "python");
})();
</script>
